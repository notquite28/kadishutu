name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --all-targets

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install check-jsonschema
      - run: check-jsonschema --check-metaschema docs/evidence/corpus-manifest.schema.json
      - run: check-jsonschema --check-metaschema docs/evidence/save-layout.schema.json
      - run: check-jsonschema --check-metaschema docs/schemas/cli-report-v1.schema.json
      - run: check-jsonschema --schemafile docs/evidence/corpus-manifest.schema.json docs/evidence/corpus-manifest.v1.json
      - run: check-jsonschema --schemafile docs/evidence/save-layout.schema.json docs/evidence/save-layout.v1.json
      - run: python tools/evidence.py verify-layout --layout docs/evidence/save-layout.v1.json --schema docs/evidence/save-layout.schema.json --source-root ..

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build detect
      - run: cargo fuzz build unreal_header
      - run: cargo fuzz build report
      - run: cargo fuzz build crypto
      - run: cargo fuzz build mutation
