[package]
name = "kadishutu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Evidence-gated SMT V: Vengeance save inspection"
license = "MIT"

[lib]
name = "kadishutu"
path = "src/lib.rs"

[[bin]]
name = "kadishutu"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

